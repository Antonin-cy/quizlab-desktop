
name: Installer Mac QuizLab

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: QuizLab-Windows-Installer

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dependances
        run: npm install

      - name: Construire QuizLab pour Mac
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Recuperer les fichiers Mac
        uses: actions/upload-artifact@v4
        with:
          name: QuizLab-Mac
          path: |
            QuizLab-Windows-Installer/dist/*.dmg
            QuizLab-Windows-Installer/dist/*.zip
            QuizLab-Windows-Installer/dist/*mac*.yml
